<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShaanCre8sArt</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="aos.css" />
</head>
<body>
  <header id="home" data-aos="fade-down">
    <h1>Welcome to ShaanCre8sArt</h1>
    <p>Featured Artworks Below</p>
  </header>

  <section id="about" data-aos="fade-right">
    <h2>About Me</h2>
    <p>I’m Shaan, a traditional fine artist creating custom drawings and paintings.</p>
  </section>

  <section id="artworks" data-aos="zoom-in">
    <h2>Artworks</h2>
    <div class="gallery">
      <div class="art-card">Drawing 1</div>
      <div class="art-card">Painting 1</div>
    </div>
  </section>

  <section id="contact" data-aos="fade-up">
    <h2>Contact / COA</h2>
    <form>
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea placeholder="Describe your custom artwork request"></textarea>
      <button type="submit">Send Request</button>
    </form>
    <p>WhatsApp | Instagram: @shaancre8sart | Email: shaan@email.com</p>
  </section>

  <script src="aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
